[project]
name = "minimax-music3-api"
version = "0.1.0"
description = "Local full-weight MiniMax-Music3 HTTP API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "accelerate>=1.6",
  "fastapi>=0.115",
  "modelscope>=1.31",
  "soundfile>=0.13",
  "torch>=2.7",
  "transformers>=4.52",
  "uvicorn[standard]>=0.34",
  "diffusers @ file:///home/alone/workspace/minimax-music3-api/vendor/diffusers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/minimax_music3_api"]

[tool.hatch.metadata]
allow-direct-references = true
